name: Actualités
# Récupère les gros titres plusieurs fois par jour (outils/actualites.mjs) et publie data/news.json.
on:
  schedule:
    - cron: '23 5,9,13,17,20 * * *'   # 6 h 23, 10 h 23, 14 h 23, 18 h 23 et 21 h 23 à Paris (heure d'hiver)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualites

jobs:
  titres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les titres
        run: node outils/actualites.mjs data/news.json
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/news.json; then echo "Rien à publier."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -q -m "Actualités : titres mis à jour"
          for essai in 1 2 3; do
            git fetch -q origin main gh-pages
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            if git push -q origin HEAD:main && git push -q origin HEAD:gh-pages; then
              gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null 2>&1 || true
              echo "Titres publiés."
              exit 0
            fi
            sleep 15
          done
          echo "Publication impossible : une branche a divergé."
          exit 1
